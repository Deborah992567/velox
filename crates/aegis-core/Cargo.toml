[package]
name = "aegis-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core library for the Aegis (Velox) web server: networking core, HTTP stack, proxy, and process architecture implemented from scratch."
repository = "https://github.com/Deborah992567/velox"
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
libc = "0.2"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["std", "formatting", "macros"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
